let S={screen:'home',name:'',animal:'🦊',done:[],mid:0,clues:[],reveal:null,pick:null,checked:false,wrong:false,qi:0,ans:[],stage:'main',mistakes:[],retry:0,firstScore:0};try{let d=JSON.parse(localStorage.foxQuest||'{}');S.name=d.name||'';S.animal=d.animal||'🦊';S.done=d.done||[]}catch{}const A=document.querySelector('#app');
function save(){localStorage.foxQuest=JSON.stringify({name:S.name,animal:S.animal,done:S.done})}
function view(x){S.screen=x;render();scrollTo(0,0)}
function home(){let animals=[['🦊','機智狐狸'],['🐯','勇猛老虎'],['🦌','敏捷小鹿'],['🐰','靈巧白兔'],['🦉','智慧貓頭鷹'],['🐻','穩重棕熊']];return `<section class="wrap home"><div><span class="tag">✨ 六年級文言文 × 四層次閱讀理解</span><h1>跟著狐狸<br><span>破解森林假象</span></h1><p class="lead">百獸拔腿就跑，真的是因為害怕狐狸嗎？走進三幕故事，蒐集線索、拆解說詞，再延伸閱讀〈畫蛇添足〉。</p><div class="stats"><div class="stat"><b>3</b><small>故事任務</small></div><div class="stat"><b>12</b><small>圖上線索</small></div><div class="stat"><b>8</b><small>閱讀考驗</small></div></div></div><div class="card login"><div class="scenehero"><span>${S.animal}</span><span>🌲</span></div><label>探險家姓名</label><input id="name" value="${esc(S.name)}" placeholder="請輸入姓名或暱稱"><label>選擇代表你的森林動物</label><div class="animal-picker">${animals.map(a=>`<button type="button" data-animal="${a[0]}" class="animal-choice ${S.animal===a[0]?'chosen':''}" aria-label="選擇${a[1]}"><b>${a[0]}</b><small>${a[1]}</small></button>`).join('')}</div><button id="start" class="primary wide" ${S.name?'':'disabled'}>和 ${S.animal} 一起進入森林 →</button><p class="privacy">姓名、動物與進度只會儲存在這台裝置。</p></div></section>`}

function map(){return `<section class="wrap"><div class="toprow"><div><span class="tag">🗺️ 任務地圖</span><h1>歡迎，${esc(S.name||'探險家')}！</h1><p>依序通過三幕故事，再完成〈狐假虎威〉與〈畫蛇添足〉閱讀考驗。</p></div><div class="progress"><b>探險進度　${S.done.length*25}%</b><div class="track"><i style="width:${S.done.length*25}%"></i></div></div></div><div class="missions">${M.map((m,i)=>`<button class="mission" data-m="${i}" ${i>S.done.length?'disabled':''}><div class="visual" style="background-image:url('assets/scene-${i+1}.png')"></div><div class="txt"><small>${m.k}</small><h2>${m.t}</h2><p>${m.sub}</p><div class="status"><span>${S.done.includes(i)?'✓ 已完成':i<=S.done.length?'開始調查':'🔒 尚未解鎖'}</span><span>›</span></div></div></button>`).join('')}</div><button id="final" class="finalbanner" ${S.done.length<3?'disabled':''}><span style="font-size:38px">🏆</span><span><small>綜合閱讀考驗</small><strong>狐假虎威 × 畫蛇添足</strong><small>${S.done.length<3?`再完成 ${3-S.done.length} 個任務即可解鎖`:'每題都有答案與詳解，錯題需再次挑戰'}</small></span></button></section>`}

function mission(){let m=M[S.mid],r=S.reveal;return `<section class="wrap"><button class="back" id="back">← 返回任務地圖</button><div class="scene-title"><small>${m.k}</small><h1>${m.t}</h1><p>${m.scene}</p></div><div class="hotspot-scene"><img src="assets/scene-${S.mid+1}.png" alt="${m.t}">${m.cl.map((c,i)=>`<button data-c="${i}" class="leaf leaf${i+1} ${S.clues.includes(i)?'found':''}" ${i>S.clues.length?'disabled':''} aria-label="策略 ${i+1}：${S.clues.includes(i)?c[1]:i===S.clues.length?'可以開啟':'尚未解鎖'}">${S.clues.includes(i)?`<span class="leaf-card"><b>策略 ${i+1}｜${c[0]} ${c[1]}</b><em>課文原文</em><q>${O[S.mid][i]}</q><em>策略說明</em><small>${c[2]}</small></span>`:`🍃 <span>策略 ${i+1}</span>`}</button>`).join('')}${r!==null?`<div class="clue-modal" role="dialog" aria-modal="true"><div class="clue-modal-card"><small>策略 ${r+1}／4</small><h2>${m.cl[r][0]} ${m.cl[r][1]}</h2><blockquote><b>課文原文</b>${O[S.mid][r]}</blockquote><p><b>策略說明</b>${m.cl[r][2]}</p><button id="closeclue" class="primary wide">我了解了，繼續找下一個策略</button></div></div>`:''}</div><div class="scene-note-row"><div class="note">💡 ${m.prompt}</div><span class="count">已找到 ${S.clues.length} / 4</span></div><div class="question">${S.clues.length<4?'<div class="waiting">🔒 請依照策略 1、2、3、4 的順序揭開葉片</div>':`<b>🧠 推理檢核</b><h3>${m.q}</h3><div class="options">${m.o.map((o,i)=>`<button class="option ${S.pick===i?'sel':''} ${S.checked&&i===m.a?'good':''} ${S.checked&&S.pick===i&&i!==m.a?'bad':''}" data-o="${i}"><i>${'ABCD'[i]}</i>${o}</button>`).join('')}</div>${S.wrong?`<div class="feedback hint"><b>再想一下：</b>${m.h}</div>`:''}${S.checked&&S.pick===m.a?`<div class="feedback ok"><b>判讀正確！</b>${m.x}</div><button id="finish" class="primary wide">完成任務，返回地圖 →</button>`:`<button id="submit" class="primary wide" ${S.pick===null?'disabled':''}>提交推理</button>`}`}</div></section>`}

function quiz(){let bank=S.stage==='main'?Q:XQ,q=bank[S.qi],total=bank.length,chosen=S.ans[S.qi],locked=S.checked;return `<section class="wrap quiz"><div class="center"><span class="tag">${S.stage==='main'?'🏆 狐假虎威閱讀考驗':'🐍 畫蛇添足閱讀考驗'}</span><h1 style="font:900 40px serif;color:var(--deep)">${S.stage==='main'?'明察秋毫':'避免多此一舉'}</h1><p>作答後會立即公布正確答案與詳解。</p></div><div class="dots">${bank.map((_,i)=>`<i class="${i<=S.qi?'on':''}"></i>`).join('')}</div><div class="card quizcard"><span class="level">第 ${S.qi+1} 題・${q[0]}</span><h2>${q[1]}</h2><div class="options">${q[2].map((o,i)=>`<button class="option ${chosen===i?'sel':''} ${locked&&i===q[3]?'good':''} ${locked&&chosen===i&&i!==q[3]?'bad':''}" data-a="${i}" ${locked?'disabled':''}><i>${'ABCD'[i]}</i>${o}</button>`).join('')}</div>${locked?`<div class="feedback ${chosen===q[3]?'ok':'hint'}"><b>${chosen===q[3]?'回答正確！':'正確答案：'+ 'ABCD'[q[3]]}</b>${q[4]}</div>`:''}<div class="nav"><span></span>${!locked?`<button id="checkq" class="primary" ${chosen===undefined?'disabled':''}>確認答案</button>`:`<button id="next" class="primary">${S.qi===total-1?(S.stage==='main'?'前往延伸閱讀 →':'完成閱讀考驗 →'):'下一題 →'}</button>`}</div></div></section>`}
function extension(){return `<section class="wrap reading"><div class="center"><span class="tag">🐍 寓言延伸閱讀</span><h1>畫蛇添足的故事</h1><p>先閱讀文章與註釋，再進入三道閱讀理解題。</p></div><article class="card textcard"><h2>經典原文</h2><p class="classic">楚有祠者<sup>①</sup>，賜其舍人<sup>②</sup>卮<sup>③</sup>酒，舍人相謂<sup>④</sup>曰：「數人飲之<sup>⑤</sup>不足，一人飲之有餘。請畫地為蛇<sup>⑥</sup>，先成者飲酒。」</p><p class="classic">一人蛇先成，引酒且飲之<sup>⑦</sup>，乃<sup>⑧</sup>左手持卮，右手畫蛇，曰：「吾能為之足<sup>⑨</sup>。」未成，一人之蛇成，奪其卮曰：「蛇固<sup>⑩</sup>無足，子安能<sup>⑪</sup>為之足？」遂<sup>⑫</sup>飲其酒。為蛇足者，終亡<sup>⑬</sup>其酒。</p><h2>注釋</h2><div class="notes"><p>① 祠者：主持祭祀的人。祠，祭祀。</p><p>② 舍人：依附在門下、為主人辦事的門客。</p><p>③ 卮：音ㄓ，古代盛酒的器具；「卮酒」指一杯酒。</p><p>④ 相謂：互相商量、彼此說。</p><p>⑤ 之：代名詞，指酒。</p><p>⑥ 畫地為蛇：在地上畫蛇。為，畫、作。</p><p>⑦ 引酒且飲之：拿過酒，正準備喝。引，拿、取；且，將要。</p><p>⑧ 乃：於是、就。</p><p>⑨ 為之足：替蛇添上腳。為，替、給；之，指蛇；足，腳。</p><p>⑩ 固：本來。</p><p>⑪ 子安能：你怎麼能。子，你；安，怎麼。</p><p>⑫ 遂：於是、就。</p><p>⑬ 亡：失去。</p></div><button id="extstart" class="primary wide">開始〈畫蛇添足〉閱讀考驗 →</button></article></section>`}
function retry(){let id=S.mistakes[S.retry],bank=id[0]==='m'?Q:XQ,q=bank[+id.slice(1)],chosen=S.pick,ok=S.checked&&chosen===q[3];return `<section class="wrap quiz"><div class="center"><span class="tag">🔄 錯題闖關</span><h1 style="font:900 40px serif;color:var(--deep)">再想一次，就能過關</h1><p>共有 ${S.mistakes.length} 題需要重新挑戰，目前第 ${S.retry+1} 題。</p></div><div class="card quizcard"><span class="level">${q[0]}</span><h2>${q[1]}</h2><div class="options">${q[2].map((o,i)=>`<button class="option ${chosen===i?'sel':''} ${ok&&i===q[3]?'good':''} ${S.checked&&chosen===i&&i!==q[3]?'bad':''}" data-r="${i}"><i>${'ABCD'[i]}</i>${o}</button>`).join('')}</div>${S.checked?`<div class="feedback ${ok?'ok':'hint'}"><b>${ok?'答對了，可以繼續！':'還差一點，請重新選擇。'}</b>${q[4]}</div>`:''}<button id="retrycheck" class="primary wide" ${chosen===null?'disabled':''}>${ok?'下一題 →':'再次確認'}</button></div></section>`}
function certificate(){let wrong=S.mistakes.length,score=S.firstScore,evalText=score>=88&&wrong<=1?'能精準提取文言訊息、辨析因果與表象，並把寓意靈活運用到生活情境，展現優秀的閱讀推理力。':score>=70?'能掌握兩則寓言的情節與主旨，經過錯題修正後已能釐清關鍵概念，閱讀思考穩健。':'願意根據詳解修正想法並完成錯題挑戰，已建立文言閱讀基礎；若再複習字詞與因果關係，會更加熟練。';return `<section class="wrap"><div class="certificate forest-cert"><div class="forest-crown">🌿 ✨ 🌲 🏆 🌲 ✨ 🌿</div><div class="cert-forest"><img src="assets/scene-2.png" alt="森林榮耀舞臺"><div class="forest-audience">🐿️　🦌　🐰　🦉　🐻</div><div class="honoree"><span>${S.animal}</span><b>榮耀探險家</b></div></div><div class="seal">🏅</div><small>康軒六年級・寓言閱讀探險</small><h1>森林真相局・學習證書</h1><p>森林萬物共同見證</p><h2>${esc(S.name||'探險家')}</h2><p><b>${S.animal} 已完成榮耀試煉！</b><br>完成〈狐假虎威〉與〈畫蛇添足〉閱讀理解挑戰</p><div class="certstats"><div><b>${score}</b><span>首次作答分數</span></div><div><b>${wrong}</b><span>完成訂正題數</span></div><div><b>8</b><span>閱讀考驗題數</span></div></div><div class="evaluation"><b>🌟 森林智者的學習評價 🌟</b><p>${evalText}</p></div><div class="forest-ribbon">🍃 卓越閱讀勇士・森林智慧徽章 🍃</div><footer><span>完成日期：${new Date().toLocaleDateString('zh-TW')}</span><span>🦊🐯 寓言閱讀探險認證 🐰🦉</span></footer></div><div class="cert-actions"><button id="print" class="primary">列印／儲存證書</button><button id="tomap" class="secondary">回到任務地圖</button></div></section>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){A.innerHTML=S.screen==='home'?home():S.screen==='map'?map():S.screen==='mission'?mission():S.screen==='quiz'?quiz():S.screen==='extension'?extension():S.screen==='retry'?retry():certificate();bind()}
function bind(){let n=document.querySelector('#name');if(n)n.oninput=e=>{S.name=e.target.value;save();document.querySelector('#start').disabled=!S.name.trim()};let start=document.querySelector('#start');if(start)start.onclick=()=>view('map');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mid=+b.dataset.m;S.clues=[];S.reveal=null;S.pick=null;S.checked=false;S.wrong=false;view('mission')});let back=document.querySelector('#back');if(back)back.onclick=()=>view('map');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{let i=+b.dataset.c;if(S.clues.includes(i)){S.reveal=i;render()}else if(i===S.clues.length){S.clues.push(i);S.reveal=i;render()}});let close=document.querySelector('#closeclue');if(close)close.onclick=()=>{S.reveal=null;render()};document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.pick=+b.dataset.o;S.checked=false;S.wrong=false;render()});let sub=document.querySelector('#submit');if(sub)sub.onclick=()=>{S.checked=true;S.wrong=S.pick!==M[S.mid].a;render()};let fin=document.querySelector('#finish');if(fin)fin.onclick=()=>{if(!S.done.includes(S.mid))S.done.push(S.mid);save();view('map')};let fq=document.querySelector('#final');if(fq)fq.onclick=()=>{S.stage='main';S.qi=0;S.ans=[];S.mistakes=[];S.checked=false;view('quiz')};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!S.checked){S.ans[S.qi]=+b.dataset.a;render()}});let cq=document.querySelector('#checkq');if(cq)cq.onclick=()=>{S.checked=true;let bank=S.stage==='main'?Q:XQ;if(S.ans[S.qi]!==bank[S.qi][3])S.mistakes.push((S.stage==='main'?'m':'x')+S.qi);render()};let next=document.querySelector('#next');if(next)next.onclick=()=>{let bank=S.stage==='main'?Q:XQ;if(S.qi<bank.length-1){S.qi++;S.checked=false;render()}else if(S.stage==='main'){view('extension')}else{S.firstScore=Math.round((8-S.mistakes.length)/8*100);S.pick=null;S.checked=false;S.retry=0;view(S.mistakes.length?'retry':'certificate')}};let ex=document.querySelector('#extstart');if(ex)ex.onclick=()=>{S.stage='ext';S.qi=0;S.ans=[];S.checked=false;view('quiz')};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.pick=+b.dataset.r;S.checked=false;render()});let rc=document.querySelector('#retrycheck');if(rc)rc.onclick=()=>{let id=S.mistakes[S.retry],bank=id[0]==='m'?Q:XQ,q=bank[+id.slice(1)];if(S.checked&&S.pick===q[3]){if(S.retry<S.mistakes.length-1){S.retry++;S.pick=null;S.checked=false;render()}else view('certificate')}else{S.checked=true;render()}};let pr=document.querySelector('#print');if(pr)pr.onclick=()=>print();let tm=document.querySelector('#tomap');if(tm)tm.onclick=()=>view('map')}

document.addEventListener('click',e=>{let b=e.target.closest('[data-animal]');if(b){S.animal=b.dataset.animal;save();render()}});
document.querySelector('#reset').onclick=()=>{if(confirm('確定要清除姓名、動物與所有探險進度嗎？')){localStorage.removeItem('foxQuest');S={screen:'home',name:'',animal:'🦊',done:[],mid:0,clues:[],reveal:null,pick:null,checked:false,wrong:false,qi:0,ans:[],stage:'main',mistakes:[],retry:0,firstScore:0};render()}};let sound=true;document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊':'🔇'};render();
</script></body></html>
