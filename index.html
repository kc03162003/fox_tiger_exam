let sound=true,currentBg='',bgAudio=new Audio();bgAudio.loop=true;bgAudio.volume=.18;const bgTracks={home:'sound/Map_of_the_Hidden_Grove.mp3',map:'sound/Map_of_the_Hidden_Grove.mp3',mission0:'sound/The_Fox_and_the_Bamboo_Gambit.mp3',mission1:'sound/The_Tiger_Follows.mp3',mission2:'sound/The_Chancellor_s_Decree.mp3',quiz:'sound/Measured_Steps.mp3',extension:'sound/Measured_Steps.mp3',retry:'sound/Measured_Steps.mp3',certificate:'sound/Crown_of_Leaves.mp3',escape:'sound/The_Tiger_Follows.mp3'},sfxFiles={click:'sound/effects/click.mp3',reveal:'sound/effects/reveal.mp3',correct:'sound/effects/correct.mp3',wrong:'sound/effects/wrong.mp3',complete:'sound/effects/complete.mp3',certificate:'sound/effects/certificate.mp3'};function bgKey(){return S.screen==='mission'?'mission'+S.mid:S.screen}function syncAudio(){let key=bgKey(),src=bgTracks[key];if(!sound){bgAudio.pause();return}if(src&&currentBg!==key){bgAudio.pause();bgAudio.src=src;currentBg=key;bgAudio.play().catch(()=>{currentBg=''})}else if(src&&bgAudio.paused)bgAudio.play().catch(()=>{})}function playSfx(name){if(!sound||!sfxFiles[name])return;let a=new Audio(sfxFiles[name]);a.volume=.55;a.play().catch(()=>{})}
